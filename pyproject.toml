[project]
name = "agent-erp-core"
version = "0.1.0"
description = "An agent-first ERP core for discrete manufacturing: event-sourced ledger, policy engine, and domain commands"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["applied_erp"]
